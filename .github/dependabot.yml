version: 2
updates:
  # Python package + dev/optional extras
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      # Bundle safe minor/patch bumps into a single weekly PR; leave majors
      # as individual PRs so breaking changes stay reviewable.
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # React / TypeScript dashboard
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Frontend majors need a coordinated migration (React 19 = react + react-dom +
      # @types + @vitejs/plugin-react together; vite 8 and plugin-react 6 are peer-linked;
      # TypeScript 7 is the experimental native rewrite). Hold them until we do that
      # upgrade deliberately, so Dependabot stops reopening PRs that break the dashboard build.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    groups:
      # Action bumps are low-risk; bundle everything into one PR.
      github-actions:
        patterns: ["*"]
